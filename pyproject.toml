[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-dropbox-backup"
version = "0.1.0"
description = "A safety-first one-way local-to-Dropbox mirror for small datasets."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "dropbox>=12.2.4,<13",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9"]

[project.scripts]
dropbox-mirror = "dropbox_mirror.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
