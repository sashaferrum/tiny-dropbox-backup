[general]
timezone = Europe/Moscow
credentials_file = /home/admin/.dropbox-mirror/credentials.json
log_file = /home/admin/.dropbox-mirror/mirror.log
lock_file = /home/admin/.dropbox-mirror/process.lock

[dropbox]
app_key = YOUR_DROPBOX_APP_KEY

[job:documents]
source_type = directory
source = /home/example/documents
destination = /documents
schedule = interval
interval = 2h
exclude =
    .git/
    __pycache__/
    *.tmp
    cache/

[job:report]
source_type = file
source = /home/example/reports/report.pdf
destination = /reports/report.pdf
schedule = daily
times = 10:00, 23:30

[job:pdf_reports]
source_type = glob
source = /home/example/reports/*.pdf
destination = /pdf-reports
schedule = daily
times = 23:45
